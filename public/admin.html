<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gerenciar materiais | Da Teoria à Conduta</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><header class="header"><a class="brand" href="/"><img src="/assets/logo.png" alt="Da Teoria à Conduta"></a><nav><a href="/">Ver loja ↗</a><button id="signout" hidden>Sair</button></nav></header>
<main class="admin-main"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Seus materiais.</h1><p id="status" role="status">Verificando seu acesso…</p>
<section id="login" hidden><h2>Entre na conta administradora</h2><form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="button primary">Entrar</button></form><p><a href="/">Criar conta ou recuperar senha na loja</a></p></section>
<section id="workspace" hidden><div class="admin-toolbar"><button id="new" class="button primary">Adicionar material +</button><button id="hide-examples" class="details-button">Retirar exemplos da vitrine</button></div><p class="help">Ao retirar um material da vitrine, quem já comprou continua com acesso.</p><div id="list" class="admin-list"></div></section>
<dialog id="editor" class="wide-dialog" aria-labelledby="editor-title"><button class="close" type="button" id="close-editor" aria-label="Fechar">×</button><h2 id="editor-title">Adicionar material</h2>
<form id="product-form"><input name="id" type="hidden"><input name="file_path" type="hidden"><label>Título<input name="title" required maxlength="160"></label><div class="form-grid"><label>Categoria<select name="category"><option>Ciclo básico</option><option>Clínica médica</option><option>Internato</option></select></label><label>Preço (R$)<input name="price" type="number" min="0.01" max="999999.99" step="0.01" required></label></div><label>Descrição<textarea name="description" required maxlength="1500" rows="3"></textarea></label><label>Texto da capa<textarea name="cover" maxlength="160" rows="2" placeholder="Se vazio, será usado o título"></textarea></label><label>Tópicos — um por linha<textarea name="topics" rows="3" placeholder="Até 12 tópicos"></textarea></label><div class="form-grid"><label>Formato<input name="format" value="Material digital · PDF" required maxlength="120"></label><label>Cor da capa<select name="tone"><option value="">Turquesa</option><option value="slate">Azul</option><option value="sand">Areia</option></select></label><label>Ordem na vitrine<input name="position" type="number" min="0" max="10000" step="1" value="0" required></label></div><label>Arquivo PDF — até 20 MB<input name="pdf" type="file" accept="application/pdf,.pdf"></label><p id="file-status" class="help"></p><label class="check"><input name="active" type="checkbox"> Publicar na vitrine</label><label class="check"><input name="demo" type="checkbox"> Material demonstrativo (sem venda)</label><p id="save-status" role="status"></p><button id="save" class="button primary full">Salvar material</button></form></dialog></main></body></html>
